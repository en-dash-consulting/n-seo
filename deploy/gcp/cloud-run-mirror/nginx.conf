server {
  # Cloud Run always sends traffic to $PORT, which defaults to 8080.
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # The exporter writes directories with an index.html; the dashboard links
  # to /actions rather than /actions/.
  location / {
    try_files $uri $uri/index.html $uri/ =404;
  }

  # This is an internal ops mirror sitting behind IAP. Even so, say it out
  # loud: nothing here should ever appear in a search index.
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # The mirror is regenerated once a day; let a browser cache it briefly but
  # never long enough to hide a fresh run.
  location ~* \.(css|svg|png|webp|ico)$ {
    expires 1h;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
}
