name: release

# Publishing is driven by the tag, so the git history is the record of what
# was released. Everything here refuses rather than guesses: a tag that does
# not match package.json, or a version with no changelog section, stops the
# run before anything reaches the registry.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance signs against this

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/n-seo
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # No registry-url on purpose. It writes an .npmrc whose auth line
      # interpolates NODE_AUTH_TOKEN, and an empty value there makes a trusted
      # publish fail with a misleading 404 instead of an auth error.

      # Node 22 ships npm 10, and trusted publishing needs 11.5.1 or later.
      # Without this the OIDC exchange never happens.
      - name: npm new enough for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag  package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - name: Changelog must describe this version
        run: node .github/scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" > /dev/null

      - name: Install
        run: npm ci

      - name: Full check
        run: npm run check

      # The same script CI runs on every push. A release must not be the first
      # time the published artifact is actually installed and driven.
      - name: Pack, install and drive the tarball
        run: .github/scripts/pack-smoke.sh

      # Authentication is OIDC: npm exchanges the id-token above for a
      # short-lived credential. No secret is stored in this repository, which
      # is the point — a long-lived publish token is the thing worth stealing.
      # It requires a trusted publisher configured on the package at
      # npmjs.com, which in turn requires the package to already exist; see
      # docs/RELEASING.md for how the first release bootstraps that.
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Release notes from the changelog
        run: node .github/scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
