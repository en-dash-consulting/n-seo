name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json engines; 22 is what we develop on.
        os: [ubuntu-latest]
        node: [20, 22]
        # Windows is a supported target, so it runs the same job rather than a
        # reduced one — the interesting failures there are path, interpreter
        # and shell differences that only the real steps surface.
        include:
          - os: windows-latest
            node: 22
    defaults:
      run:
        # Git Bash on Windows, so one set of steps covers both. Windows has no
        # python3 either, hence `node ops/py.mjs` in place of it below.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Python compiles
        run: node ops/py.mjs -m py_compile $(git ls-files '*.py')

      - name: Demo dataset
        run: npm run demo

      - name: TypeScript tests
        run: npm test

      - name: Python tests
        run: npm run test:py

      - name: Dashboard serves every page
        run: |
          # By PID, not `kill %1`: job control is off in a non-interactive
          # Git Bash, so the %1 form silently leaves the server running on
          # the Windows runner and the step can hang at the end.
          npx tsx src/server.tsx > server.log 2>&1 &
          server=$!
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:4600/api/actions && break
            sleep 1
          done
          fail=0
          for route in / /actions /settings /api/actions /insights /trends /content /indexing /probes /logs /site/example.com; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:4600$route")
            echo "$code $route"
            [ "$code" = "200" ] || fail=1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:4600/mcp)
          echo "$code /mcp (expect 503: fails closed without a token)"
          [ "$code" = "503" ] || fail=1
          kill "$server" 2>/dev/null || true
          if [ "$fail" = "1" ]; then cat server.log; exit 1; fi

      - name: MCP stdio smoke
        run: npm run mcp:smoke

      # The engine + instance path (docs/INSTANCE.md mode B) is how the tool is
      # meant to be upgraded, so it has to keep working on every commit.
      - name: CLI scaffolds and runs an instance
        run: |
          set -e
          # RUNNER_TEMP is a backslash path on Windows; Git Bash's `test -f`
          # does not reliably handle the mixed separators that would produce.
          inst="${RUNNER_TEMP//\\//}/instance"
          node bin/n-seo.mjs init "$inst"
          for f in n-seo.config.json .mcp.json .gitignore config/backlog.json \
                   CLAUDE.md .claude/skills/n-seo-triage/SKILL.md; do
            test -f "$inst/$f" || { echo "init did not create $f"; exit 1; }
          done
          node bin/n-seo.mjs version --instance "$inst"
          node bin/n-seo.mjs demo --instance "$inst" > /dev/null
          test -d "$inst/data/gsc" || { echo "demo data did not land in the instance"; exit 1; }
          node bin/n-seo.mjs daily --instance "$inst" --list
          N_SEO_INSTANCE="$inst" SEO_PORT=4601 npx tsx src/server.tsx > instance-server.log 2>&1 &
          server=$!
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:4601/api/actions && break
            sleep 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4601/settings)
          echo "$code /settings (instance mode)"
          kill "$server" 2>/dev/null || true
          [ "$code" = "200" ] || { cat instance-server.log; exit 1; }

      - name: Setup doctor runs and reports
        run: |
          # Exit 1 is expected here (no service-account key in CI). Anything
          # higher is a crash, and an empty report means it failed silently.
          set +e
          node ops/py.mjs ops/doctor.py --offline > doctor.log 2>&1
          code=$?
          set -e
          cat doctor.log
          if [ "$code" -gt 1 ]; then echo "::error::doctor crashed (exit $code)"; exit 1; fi
          grep -qi "engine" doctor.log || { echo "::error::doctor produced no engine block"; exit 1; }

  package:
    # A git checkout hides packaging bugs: devDependencies are installed, the
    # engine has its own node_modules, and every file is present regardless of
    # the `files` list. Two real breaks shipped that way — tsx in
    # devDependencies, and a missing tsconfig.json that made every route 500 —
    # so the tarball gets installed into an empty project and driven on every
    # push, not only at release.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Pack, install and drive the tarball
        run: .github/scripts/pack-smoke.sh

  no-private-names:
    # The project was extracted from a private deployment. Nothing from it
    # (hosts, account names, IDs) may reappear outside the LICENSE line, the
    # README/site attribution, and the n-dx skill trailers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Grep for forbidden words
        run: |
          pattern='endash|naniel|beergame|html-in-canvas|spacetrader|stillhouse|hotdogbenchmark'
          if git grep -n -i -E "$pattern" -- ':!LICENSE' ':!.github/workflows/ci.yml' ':!www' ':!README.md' ':!.claude/skills' ':!package.json' ':!CHANGELOG.md'; then
            echo "::error::private names found (see above)"; exit 1
          fi
          echo "clean"
