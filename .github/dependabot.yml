version: 2

# The runtime dependency surface is deliberately small (hono, the MCP SDK,
# zod) and Python is stdlib-only, so these updates should be rare and easy
# to read. CI runs the full check on each PR.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
